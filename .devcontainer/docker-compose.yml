name: ${COMPOSE_PROJECT_NAME:-ninjaquokka}
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:4-24-trixie
    volumes:
      # ".." is relative to this file, i.e. the project root. Only the project is mounted.
      - ..:/workspace:cached
    command: sleep infinity
    # Share the db container's network so "localhost:5432" reaches Postgres.
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Assembled from .env; the ${VAR:-default} fallbacks mirror the .env values.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@localhost:5432/${DB_NAME:-app}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-better-auth-secret-change-me-0123456789}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:5173}
      AUTH_EMAIL_PASSWORD_ENABLED: ${AUTH_EMAIL_PASSWORD_ENABLED:-true}
      # Optional OIDC SSO. Uncomment these entries and set the values in
      # .devcontainer/.env (or the shell); Compose only passes variables listed
      # here. Leave AUTH_SSO_CLIENT_SECRET out for a public/PKCE client.
      # AUTH_SSO_PROVIDER_ID: ${AUTH_SSO_PROVIDER_ID}
      # AUTH_SSO_DISCOVERY_URL: ${AUTH_SSO_DISCOVERY_URL}
      # AUTH_SSO_CLIENT_ID: ${AUTH_SSO_CLIENT_ID}
      # AUTH_SSO_CLIENT_SECRET: ${AUTH_SSO_CLIENT_SECRET}
      # AUTH_SSO_SCOPES: ${AUTH_SSO_SCOPES}
      # AUTH_SSO_LABEL: ${AUTH_SSO_LABEL}
      # PORT is deliberately NOT in .env: it is also referenced in devcontainer.json
      # (forwardPorts/portsAttributes) and apps/web/vite.config.ts (the /api proxy).
      # Changing it here alone would break those, so treat 3000 as a fixed convention.
      PORT: '3000'

  db:
    image: postgres:18
    restart: unless-stopped
    volumes:
      # Postgres 18+ images keep data in a versioned subfolder, so mount the parent.
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-app}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
